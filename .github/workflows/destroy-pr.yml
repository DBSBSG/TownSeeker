name: Reconcile Hostinger Environments

on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [Deploy to Hostinger]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: hostinger-environments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      deployments: write
    steps:
      - name: Check out trusted deployment code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile production, stage, and one PR slot
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME }}
          HOSTINGER_DOMAIN: ${{ vars.HOSTINGER_DOMAIN }}
          HOSTINGER_STAGE_DOMAIN: ${{ vars.HOSTINGER_STAGE_DOMAIN }}
          HOSTINGER_PREVIEW_1_DOMAIN: ${{ vars.HOSTINGER_PREVIEW_1_DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: node deploy/preview-slots.mjs
