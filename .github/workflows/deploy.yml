name: Deploy to Hostinger

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, stage, "feature/**", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  e2e:
    uses: ./.github/workflows/playwright.yml
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - run: pnpm exec tsc --noEmit
      - run: pnpm check:admin
      - run: pnpm test:admin
      - run: node --check server/dataBackup.mjs
      - run: node --test tests/previewDeployment.test.mjs
      - run: pnpm exec prettier --check deploy/preview-slots.mjs tests/previewDeployment.test.mjs .github/workflows/deploy.yml .github/workflows/destroy-pr.yml
      - run: bash -n deploy/deploy.sh
