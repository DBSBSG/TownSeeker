name: Deploy to Hostinger

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  e2e:
    uses: ./.github/workflows/playwright.yml
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - run: pnpm exec tsc --noEmit
      - run: pnpm check:admin
      - run: pnpm test:admin
      - run: bash -n deploy/deploy.sh
  web-deploy:
    name: Deploy
    needs: [lint, e2e, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
      # Disable Hostinger automatic push deployments so checks gate releases.
      - name: Build and deploy Node.js application on Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME }}
          HOSTINGER_DOMAIN: ${{ vars.HOSTINGER_DOMAIN }}
          HOSTINGER_GIT_INSTALLATION_UUID: ${{ vars.HOSTINGER_GIT_INSTALLATION_UUID }}
        run: bash deploy/deploy.sh
